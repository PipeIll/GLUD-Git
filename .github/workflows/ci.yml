name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Syntax check
        run: find app/ -name "*.py" -exec python -m py_compile {} \;

      - name: Lint check
        run: flake8 app/ --max-line-length=100 --ignore=E302,W503

      - name: Import check
        run: python -c "import app.main"

      - name: Check project structure
        run: |
          test -f README.md
          test -f requirements.txt
          test -d app
          test -f app/data/clients.json
          test -f app/data/routines.json
          test -f app/data/progress.json
